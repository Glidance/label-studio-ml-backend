name: Build SAM3 Docker Image - Method 3 (Combined Text + Points)

on:
  workflow_dispatch:
  push:
    branches:
      - sam3-method3-combined
    paths:
      - 'label_studio_ml/examples/segment_anything_3_image/**'
      - '.github/workflows/docker-build.yml'

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 767397759867.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: label-studio-ml-backend

jobs:
  build:
    runs-on: label-studio-ml-backend-rss
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-skip-session-tagging: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build and push to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./label_studio_ml/examples/segment_anything_3_image
          file: ./label_studio_ml/examples/segment_anything_3_image/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max

      - name: Image details
        run: |
          echo "Docker image built and pushed successfully!"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"
